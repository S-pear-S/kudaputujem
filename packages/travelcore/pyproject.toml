[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travelcore"
version = "0.1.0"
description = "Deljeni ugovor Kuda putujem backend-a: enumi, modeli, normalizacija (ADR 0001)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/travelcore"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
