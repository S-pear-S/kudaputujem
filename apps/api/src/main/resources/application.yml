spring:
  application:
    name: kudaputujem-api

  datasource:
    url: ${DATABASE_URL_JDBC:jdbc:postgresql://localhost:5432/kudaputujem}
    username: ${POSTGRES_USER:kudaputujem}
    password: ${POSTGRES_PASSWORD:promeni_me}
    hikari:
      maximum-pool-size: 15
      # Ingest ume da drzi konekciju duze; pretraga mora brzo da dobije svoju.
      connection-timeout: 10000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  # Skreperi salju velike batch-eve; podrazumevanih 8 KB zaglavlja je dovoljno, telo nije limitirano ovde.
  compression:
    enabled: true
    mime-types: application/json
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

kudaputujem:
  security:
    ingest-api-key: ${INGEST_API_KEY:dev-ingest-key}
    admin-api-key: ${ADMIN_API_KEY:dev-admin-key}
    ip-hash-salt: ${IP_HASH_SALT:dev-salt}
  search:
    default-page-size: 20
    max-page-size: 100
    cache-ttl-seconds: 300
    max-staleness-hours: 96
  ingest:
    suspect-ratio: 0.5
    history-window: 5
    max-offers-per-batch: 500
  lead:
    max-per-hour-per-ip: 5
    max-per-hour-per-email: 3
    retention-days: 365
    consent-text-version: "2026-08-01"
  cors:
    allowed-origins:
      - http://localhost:3000

logging:
  level:
    root: INFO
    rs.kudaputujem: DEBUG
    org.springframework.jdbc.core: INFO
