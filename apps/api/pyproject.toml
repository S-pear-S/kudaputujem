[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travelapi"
version = "0.1.0"
description = "API 'Kuda putujem' (ADR 0001) — FastAPI, psycopg 3, alembic"
requires-python = ">=3.12"
dependencies = [
    "travelcore",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/travelapi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
