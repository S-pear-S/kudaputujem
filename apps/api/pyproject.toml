[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travelapi"
version = "0.1.0"
description = "API 'Kuda putujem' (ADR 0001) — trenutno samo alembic migracije, FastAPI dolazi u koraku 4"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/travelapi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
