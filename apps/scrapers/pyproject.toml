[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travelscrape"
version = "0.1.0"
description = "Skreperi srpskih turističkih agencija za Kuda putujem metapretraživač"
requires-python = ">=3.12"
dependencies = [
    "travelcore",
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.9",
    "tenacity>=8.4",
    "PyYAML>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
travelscrape = "travelscrape.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/travelscrape"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
